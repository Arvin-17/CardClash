name: Game

on:
  pull_request:
    paths: ["game/**", ".github/workflows/game.yml"]
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/game.yml"]

env:
  GODOT_VERSION: "4.7.2"
  GUT_VERSION: "9.7.1"

jobs:
  godot:
    name: Godot import, GUT tests, smoke run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot

      - name: Add Godot to PATH
        working-directory: .
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install GUT ${{ env.GUT_VERSION }}
        run: |
          curl -fsSL "https://github.com/bitwes/Gut/archive/refs/tags/v${GUT_VERSION}.tar.gz" | tar xz -C /tmp
          mkdir -p addons
          cp -r "/tmp/Gut-${GUT_VERSION}/addons/gut" addons/gut

      - name: Import project
        # A fresh checkout has no .godot/ cache yet, so the custom theme's font can't load
        # until this first import finishes; its startup errors are expected and ignored.
        run: godot --headless --import > /tmp/import-first.log 2>&1 || true

      - name: Check that every script and resource loads (second import pass)
        run: |
          godot --headless --import 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|No loader found" /tmp/import.log; then exit 1; fi

      - name: Unit tests (GUT)
        run: |
          set -o pipefail
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee /tmp/gut.log
          # GUT skips a test file that fails to parse instead of failing, so catch that here.
          if grep -E "SCRIPT ERROR|Failed to load script|Ignoring script" /tmp/gut.log; then exit 1; fi

      - name: Smoke run (main menu)
        run: |
          godot --headless --fixed-fps 60 --quit-after 600 2>&1 | tee /tmp/menu.log
          if grep -E "SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit" /tmp/menu.log; then exit 1; fi

      - name: Smoke run (a full battle played by the autoplay bot)
        run: |
          godot --headless --fixed-fps 60 --quit-after 30000 res://scenes/battle.tscn -- --autoplay 2>&1 | tee /tmp/battle.log
          if grep -E "SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit" /tmp/battle.log; then exit 1; fi
          grep -q "SMOKE battle" /tmp/battle.log || { echo "the battle never finished"; exit 1; }

      - name: Smoke run (a whole run, menu to ending, played by the autoplay bot)
        run: |
          godot --headless --fixed-fps 60 --quit-after 400000 -- --autoplay 2>&1 | tee /tmp/run.log
          if grep -E "SCRIPT ERROR|Parse Error|class instance is gone|leaked at exit|still in use at exit" /tmp/run.log; then exit 1; fi
          grep -q "SMOKE run" /tmp/run.log || { echo "the run never reached an ending"; exit 1; }

      - name: Smoke run (demo mode, straight to the Queen, played by the autoplay bot)
        run: |
          godot --headless --fixed-fps 60 --quit-after 100000 -- --autoplay --demo 2>&1 | tee /tmp/demo.log
          if grep -E "SCRIPT ERROR|Parse Error|class instance is gone|leaked at exit|still in use at exit" /tmp/demo.log; then exit 1; fi
          grep -q "SMOKE battle .* vs queen_of_hearts" /tmp/demo.log || { echo "the demo never fought the Queen"; exit 1; }
          grep -q "SMOKE run .*(demo)" /tmp/demo.log || { echo "the demo never reached an ending"; exit 1; }
